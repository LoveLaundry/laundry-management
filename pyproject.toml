[project]
name = "laundry-management"
version = "0.2.0"
description = "Laundry Business Management & Historical Records Service (MongoDB + AES-256-GCM)"
readme = "README.md"
authors = [
    { name = "DulshanSiriwardhana", email = "dulshansiriwardhanaofficial@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.5.2",
    "motor>=3.6.0,<4.0.0",
    "pymongo>=4.6.0",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
]

[tool.vercel]
entrypoint = "api.index:app"